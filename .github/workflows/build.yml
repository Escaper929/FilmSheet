name: Build FilmSheet

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'           # 推送 v1.0, v1.0.1 等标签时触发
  workflow_dispatch:   # 允许手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r api/requirements.txt

      - name: Run core tests
        run: python -m unittest tests.test_core tests.test_api -v

      - name: 校验版本号与 tag 一致
        # 打 tag 时，仓库内的 filmsheet/_version.py 必须与 tag 版本同步，
        # 否则发版会因版本号脱节而失败。
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          GOT=$(grep -oP '__VERSION__\s*:\s*str\s*=\s*"\K[^"]+' filmsheet/_version.py)
          if [ "$TAG" != "$GOT" ]; then
            echo "::error::版本号不一致：tag=v${TAG}，但 filmsheet/_version.py 里是 ${GOT}。请先在 main 上把 _version.py 更新为 ${TAG} 再打 tag。"
            exit 1
          fi
          echo "版本号一致：v${TAG}"

  # ========== macOS arm64 打包 ==========
  build-macos-arm64:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pillow ttkthemes pyinstaller

      - name: 获取版本号
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 更新版本号文件
        if: steps.version.outputs.VERSION != ''
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        shell: bash
        run: |
          echo "__VERSION__: str = \"$VERSION\"" > filmsheet/_version.py

      - name: 打包 macOS arm64 应用
        shell: bash
        run: |
          pyinstaller main.spec --clean
          xattr -cr dist/FilmSheet.app
          test -d dist/FilmSheet.app/Contents/Frameworks
          # `macos-latest` 的架构由 GitHub 决定，将来可能变化；产物架构漂移
          # 不会有任何报错，只会在用户机器上变成「打不开」。这里断言而不是
          # 只打印 —— 只打印的写法失败了也返回 0。
          ARCH=$(lipo -archs dist/FilmSheet.app/Contents/MacOS/FilmSheet)
          echo "产物架构: $ARCH"
          [[ "$ARCH" == *arm64* ]] || { echo "::error::期望 arm64，实际 $ARCH"; exit 1; }

      - name: 压缩 macOS 产物
        run: |
          cd dist
          zip -r ../FilmSheet-macOS-arm64.zip FilmSheet.app

      - name: 上传 macOS arm64 产物
        uses: actions/upload-artifact@v4
        with:
          name: FilmSheet-macOS-arm64
          path: FilmSheet-macOS-arm64.zip

  # ========== macOS x86_64 打包 ==========
  build-macos-x86:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    # macos-13 was retired by GitHub Actions in December 2025.  Use the
    # supported native Intel image so PyInstaller and Pillow are both x86_64.
    runs-on: macos-15-intel
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pillow ttkthemes pyinstaller

      - name: 获取版本号
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 更新版本号文件
        if: steps.version.outputs.VERSION != ''
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        shell: bash
        run: |
          echo "__VERSION__: str = \"$VERSION\"" > filmsheet/_version.py

      - name: 打包 macOS x86_64 应用
        shell: bash
        run: |
          pyinstaller main.spec --clean
          xattr -cr dist/FilmSheet.app
          test -d dist/FilmSheet.app/Contents/Frameworks
          # 同 arm64 侧：断言而非打印。这里用 -archs 而非 `file`，输出更稳定。
          ARCH=$(lipo -archs dist/FilmSheet.app/Contents/MacOS/FilmSheet)
          echo "产物架构: $ARCH"
          [[ "$ARCH" == *x86_64* ]] || { echo "::error::期望 x86_64，实际 $ARCH"; exit 1; }

      - name: 压缩 macOS 产物
        run: |
          cd dist
          zip -r ../FilmSheet-macOS-x86.zip FilmSheet.app

      - name: 上传 macOS x86_64 产物
        uses: actions/upload-artifact@v4
        with:
          name: FilmSheet-macOS-x86
          path: FilmSheet-macOS-x86.zip

  # ========== Windows 打包 ==========
  build-windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pillow ttkthemes pyinstaller

      - name: 获取版本号
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 更新版本号文件
        if: steps.version.outputs.VERSION != ''
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        shell: bash
        run: |
          echo "__VERSION__: str = \"$VERSION\"" > filmsheet/_version.py

      - name: 打包 Windows 可执行文件
        shell: bash
        run: |
          pyinstaller main.spec --clean

      - name: 压缩 .exe
        run: |
            Compress-Archive -Path "dist/FilmSheet" -DestinationPath "FilmSheet-Windows.zip"

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: FilmSheet-Windows
          path: FilmSheet-Windows.zip

  # ========== 发布到 GitHub Releases ==========
  release:
    needs: [build-macos-arm64, build-macos-x86, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 下载 macOS arm64 产物
        uses: actions/download-artifact@v4
        with:
          name: FilmSheet-macOS-arm64
          path: artifacts

      - name: 下载 macOS x86_64 产物
        uses: actions/download-artifact@v4
        with:
          name: FilmSheet-macOS-x86
          path: artifacts

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: FilmSheet-Windows
          path: artifacts

      - name: 检查产物
        run: |
          ls -laR artifacts/

      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/FilmSheet-macOS-arm64.zip
            artifacts/FilmSheet-macOS-x86.zip
            artifacts/FilmSheet-Windows.zip
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

