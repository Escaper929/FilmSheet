name: Build FilmSheet

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'           # 推送 v1.0, v1.0.1 等标签时触发
  workflow_dispatch:   # 允许手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r api/requirements.txt

      - name: Run core tests
        run: python -m unittest tests.test_core tests.test_api -v

  # ========== macOS 打包（universal 二进制，同时支持 Intel 和 Apple Silicon）==========
  build-macos:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pillow ttkthemes pyinstaller

      - name: 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: 更新版本号文件
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        shell: bash
        run: |
          echo "__VERSION__: str = \"$VERSION\"" > filmsheet/_version.py

      # ========== 原生构建 arm64 版本 ==========
      - name: 打包 arm64 macOS 应用
        shell: bash
        run: |
          pyinstaller main.spec --clean
          mv dist/FilmSheet.app dist/FilmSheet_arm64.app

      # ========== 通过 Rosetta 2 构建 x86_64 版本 ==========
      - name: 安装 x86_64 依赖
        shell: bash
        run: |
          # 强制重装 Pillow 的 x86_64 wheel（CI 的 arm64 Python 默认装了 arm64 版）
          arch -x86_64 pip install --force-reinstall --no-cache-dir pillow ttkthemes pyinstaller

      - name: 打包 x86_64 macOS 应用
        shell: bash
        run: |
          arch -x86_64 pyinstaller main.spec --clean
          mv dist/FilmSheet.app dist/FilmSheet_x86.app

      # ========== 合并为 universal binary ==========
      - name: 合并为 universal 二进制
        shell: bash
        run: |
          # 用 arm64 的 .app 为基础，替换可执行文件为 universal 版本
          lipo -create \
            dist/FilmSheet_arm64.app/Contents/MacOS/FilmSheet \
            dist/FilmSheet_x86.app/Contents/MacOS/FilmSheet \
            -output dist/FilmSheet_arm64.app/Contents/MacOS/FilmSheet
          # 保留 arm64 版本的所有资源，只替换可执行文件
          rm -rf dist/FilmSheet.app
          mv dist/FilmSheet_arm64.app dist/FilmSheet.app
          # 移除 quarantine 属性，避免 Gatekeeper 拦截
          xattr -cr dist/FilmSheet.app
          # 验证产物
          echo "=== 合并结果 ==="
          lipo -info dist/FilmSheet.app/Contents/MacOS/FilmSheet

      - name: 压缩 macOS 产物
        run: |
          cd dist
          zip -r ../FilmSheet-macOS.zip FilmSheet.app

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: FilmSheet-macOS
          path: FilmSheet-macOS.zip

  # ========== Windows 打包 ==========
  build-windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pillow ttkthemes pyinstaller

      - name: 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: 更新版本号文件
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        shell: bash
        run: |
          echo "__VERSION__: str = \"$VERSION\"" > filmsheet/_version.py

      - name: 打包 Windows 可执行文件
        shell: bash
        run: |
          pyinstaller main.spec --clean

      - name: 压缩 .exe
        run: |
            Compress-Archive -Path "dist/FilmSheet.exe" -DestinationPath "FilmSheet-Windows.zip"

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: FilmSheet-Windows
          path: FilmSheet-Windows.zip

  # ========== 发布到 GitHub Releases ==========
  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 下载 macOS 产物
        uses: actions/download-artifact@v4
        with:
          name: FilmSheet-macOS
          path: artifacts

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: FilmSheet-Windows
          path: artifacts

      - name: 检查产物
        run: |
          ls -laR artifacts/

      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/FilmSheet-macOS.zip
            artifacts/FilmSheet-Windows.zip
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
