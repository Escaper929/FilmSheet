name: Build FilmSheet

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'           # 推送 v1.0, v1.0.1 等标签时触发
  workflow_dispatch:   # 允许手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r api/requirements.txt

      - name: Run core tests
        run: python -m unittest tests.test_core tests.test_api -v

  # ========== macOS 打包（通用版，arm64 架构，Intel Mac 可通过 Rosetta 运行）==========
  build-macos:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pillow ttkthemes pyinstaller

      - name: 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: 更新版本号文件
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        shell: bash
        run: |
          echo "__VERSION__: str = \"$VERSION\"" > filmsheet/_version.py

      # ========== 原生构建 macOS 应用（arm64）==========
      - name: 打包 macOS 应用
        shell: bash
        run: |
          pyinstaller --windowed --name "FilmSheet" main.py --clean \
            --hidden-import=ui \
            --hidden-import=ui.app \
            --hidden-import=processor \
            --hidden-import=processor.film_processor \
            --hidden-import=processor.renderers_135 \
            --hidden-import=processor.renderers_120 \
            --hidden-import=processor.config_schema \
            --hidden-import=processor.edge_text \
            --hidden-import=processor.filename_utils \
            --hidden-import=processor.image_pipeline \
            --hidden-import=engine \
            --hidden-import=engine.film_engine \
            --hidden-import=utils \
            --hidden-import=utils.helpers \
            --hidden-import=filmsheet \
            --hidden-import=filmsheet._version \
            --hidden-import=PIL.ImageTk \
            --hidden-import=ttkthemes

      - name: 压缩 macOS 产物
        run: |
          cd dist
          zip -r ../FilmSheet-macOS.zip FilmSheet.app

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: FilmSheet-macOS
          path: FilmSheet-macOS.zip

  # ========== Windows 打包 ==========
  build-windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pillow ttkthemes pyinstaller

      - name: 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: 更新版本号文件
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        shell: bash
        run: |
          echo "__VERSION__: str = \"$VERSION\"" > filmsheet/_version.py

      - name: 打包 Windows 可执行文件
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name "FilmSheet" main.py --clean \
            --hidden-import=ui \
            --hidden-import=ui.app \
            --hidden-import=processor \
            --hidden-import=processor.film_processor \
            --hidden-import=processor.renderers_135 \
            --hidden-import=processor.renderers_120 \
            --hidden-import=processor.config_schema \
            --hidden-import=processor.edge_text \
            --hidden-import=processor.filename_utils \
            --hidden-import=processor.image_pipeline \
            --hidden-import=engine \
            --hidden-import=engine.film_engine \
            --hidden-import=utils \
            --hidden-import=utils.helpers \
            --hidden-import=filmsheet \
            --hidden-import=filmsheet._version \
            --hidden-import=PIL.ImageTk \
            --hidden-import=ttkthemes

      - name: 压缩 .exe
        run: |
            Compress-Archive -Path "dist/FilmSheet.exe" -DestinationPath "FilmSheet-Windows.zip"

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: FilmSheet-Windows
          path: FilmSheet-Windows.zip

  # ========== 发布到 GitHub Releases ==========
  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 下载 macOS 产物
        uses: actions/download-artifact@v4
        with:
          name: FilmSheet-macOS
          path: artifacts

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: FilmSheet-Windows
          path: artifacts

      - name: 检查产物
        run: |
          ls -laR artifacts/

      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/FilmSheet-macOS.zip
            artifacts/FilmSheet-Windows.zip
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
