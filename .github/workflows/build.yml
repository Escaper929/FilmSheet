name: Build FilmSheet

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'           # 推送 v1.0, v1.0.1 等标签时触发
  workflow_dispatch:   # 允许手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r api/requirements.txt

      - name: Run core tests
        run: python -m unittest tests.test_core tests.test_api -v

  # ========== macOS arm64 打包 ==========
  build-macos-arm64:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pillow ttkthemes pyinstaller

      - name: 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: 更新版本号文件
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        shell: bash
        run: |
          echo "__VERSION__: str = \"$VERSION\"" > filmsheet/_version.py

      - name: 打包 macOS arm64 应用
        shell: bash
        run: |
          pyinstaller main.spec --clean
          xattr -cr dist/FilmSheet.app

      - name: 压缩 macOS 产物
        run: |
          cd dist
          zip -r ../FilmSheet-macOS-arm64.zip FilmSheet.app

      - name: 上传 macOS arm64 产物
        uses: actions/upload-artifact@v4
        with:
          name: FilmSheet-macOS-arm64
          path: FilmSheet-macOS-arm64.zip

  # ========== macOS x86_64 打包 ==========
  build-macos-x86:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-13  # Intel Mac runner
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pillow ttkthemes pyinstaller

      - name: 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: 更新版本号文件
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        shell: bash
        run: |
          echo "__VERSION__: str = \"$VERSION\"" > filmsheet/_version.py

      - name: 打包 macOS x86_64 应用
        shell: bash
        run: |
          pyinstaller main.spec --clean
          xattr -cr dist/FilmSheet.app

      - name: 压缩 macOS 产物
        run: |
          cd dist
          zip -r ../FilmSheet-macOS-x86.zip FilmSheet.app

      - name: 上传 macOS x86_64 产物
        uses: actions/upload-artifact@v4
        with:
          name: FilmSheet-macOS-x86
          path: FilmSheet-macOS-x86.zip

  # ========== Windows 打包 ==========
  build-windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pillow ttkthemes pyinstaller

      - name: 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: 更新版本号文件
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        shell: bash
        run: |
          echo "__VERSION__: str = \"$VERSION\"" > filmsheet/_version.py

      - name: 打包 Windows 可执行文件
        shell: bash
        run: |
          pyinstaller main.spec --clean

      - name: 压缩 .exe
        run: |
            Compress-Archive -Path "dist/FilmSheet.exe" -DestinationPath "FilmSheet-Windows.zip"

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: FilmSheet-Windows
          path: FilmSheet-Windows.zip

  # ========== 发布到 GitHub Releases ==========
  release:
    needs: [build-macos-arm64, build-macos-x86, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 下载 macOS arm64 产物
        uses: actions/download-artifact@v4
        with:
          name: FilmSheet-macOS-arm64
          path: artifacts

      - name: 下载 macOS x86_64 产物
        uses: actions/download-artifact@v4
        with:
          name: FilmSheet-macOS-x86
          path: artifacts

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: FilmSheet-Windows
          path: artifacts

      - name: 检查产物
        run: |
          ls -laR artifacts/

      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/FilmSheet-macOS-arm64.zip
            artifacts/FilmSheet-macOS-x86.zip
            artifacts/FilmSheet-Windows.zip
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
